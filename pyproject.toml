[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-chat-exporter"
dynamic = ["version"]
description = "Archive public Claude and ChatGPT shares with branches, tools, artifacts, attachments, raw sources, and hashes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude", "chatgpt", "anthropic", "openai", "share", "archive", "export", "transcript", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["jsonschema>=4.23", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
claude-share-extract = "shared_chat_exporter.router:main"
cse = "shared_chat_exporter.router:main"
shared-chat-export = "shared_chat_exporter.router:main"
sce = "shared_chat_exporter.router:main"

[tool.setuptools]
packages = ["shared_chat_exporter"]

[tool.setuptools.dynamic]
version = { attr = "shared_chat_exporter.__version__" }
