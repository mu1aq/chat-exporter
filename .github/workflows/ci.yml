name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -v
      - name: CLI smoke test
        run: |
          cse --version
          cse info tests/fixtures/basic.json
          cse tests/fixtures/rich.json -f md
      - name: Universal router smoke test
        run: python chat2file.py --detect https://chatgpt.com/share/6749af1c-0e14-8012-8830-ce0554744fc3
